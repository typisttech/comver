name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@69031c104ed759ad5fae81ac8f4b2d939615e5ef # v9.4.2
